<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Alcancía: gestión de socios, cuotas y remesas SEPA para asociaciones, hermandades, AMPAs y clubes. Funciona sin conexión y los datos no salen del ordenador.">
<meta name="theme-color" content="#a8432a">
<title>Alcancía</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100.0 100.0%22 width=%22100%22 height=%22100%22%3E%3Ctitle%3EAlcanc%C3%ADa%3C/title%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23b24a2a%22/%3E%3Cg transform=%22translate%2815 15%29 scale%28.7%29%22%3E%3Cdefs%3E%3CclipPath id=%22ranura-a%22%3E%3Crect x=%220%22 y=%220%22 width=%22100%22 height=%2231%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cpath fill=%22%23ffffff%22 d=%22M34.6 87.2A33 33 0 1 1 65.4 87.2Z%22/%3E%3Crect x=%2237%22 y=%2284.5%22 width=%2226%22 height=%229%22 rx=%223.5%22 fill=%22%23ffffff%22/%3E%3Cg clip-path=%22url%28%23ranura-a%29%22%3E%3Ccircle cx=%2250%22 cy=%2221%22 r=%2213.2%22 fill=%22%23b24a2a%22/%3E%3Ccircle cx=%2250%22 cy=%2221%22 r=%2210.6%22 fill=%22%23e3a51f%22/%3E%3C/g%3E%3Cpath d=%22M37.5 32.5H62.5%22 stroke=%22%23b24a2a%22 stroke-width=%224.6%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>:root {
  /* Identidad Alcancía: barro (terracota), moneda (oro) y tinta cálida */
  --fondo: #f7f4f0; --superficie: #ffffff; --superficie-2: #f2ede7; --borde: #e2d8ce; --texto: #241d19; --texto-2: #65584e;
  --primario: #a8432a; --primario-texto: #ffffff; --primario-suave: #f8e8e0; --acento: #d9971a;
  --marca-barro: #b24a2a; --marca-moneda: #e3a51f; --marca-canto: #b97f0c; --marca-tinta: #241d19; --marca-hueco: var(--superficie);
  --ok: #1e7a4c; --ok-suave: #e3f3ea; --aviso: #8a5a00; --aviso-suave: #fff3d6; --error: #b3261e; --error-suave: #fde8e7;
  --radio: 10px; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --fuente: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #16120f; --superficie: #201a16; --superficie-2: #2a221d; --borde: #3d322a; --texto: #f2ebe5; --texto-2: #bcaea2;
    --primario: #f0906c; --primario-texto: #2a0f05; --primario-suave: #3d2219; --acento: #f2c35a;
    --marca-barro: #f0906c; --marca-moneda: #f2c35a; --marca-tinta: #f3ece6;
    --ok: #6fd3a0; --ok-suave: #173327; --aviso: #f3c46a; --aviso-suave: #3a2f17; --error: #ff8a80; --error-suave: #3d1d1b;
    color-scheme: dark;
  }
}
:root[data-tema="oscuro"] {
  --fondo: #16120f; --superficie: #201a16; --superficie-2: #2a221d; --borde: #3d322a; --texto: #f2ebe5; --texto-2: #bcaea2;
  --primario: #f0906c; --primario-texto: #2a0f05; --primario-suave: #3d2219; --acento: #f2c35a;
  --marca-barro: #f0906c; --marca-moneda: #f2c35a; --marca-tinta: #f3ece6;
  --ok: #6fd3a0; --ok-suave: #173327; --aviso: #f3c46a; --aviso-suave: #3a2f17; --error: #ff8a80; --error-suave: #3d1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 var(--fuente); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .6em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
a { color: var(--primario); }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
.oculto { display: none !important; }
td.num { white-space: nowrap; }
details.historial { margin-top: 8px; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; }
details.historial summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
details.historial[open] summary { margin-bottom: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* estructura */
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
.cabecera { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--superficie); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 5; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--primario); text-decoration: none; }
.marca svg.marca-logo { width: auto; height: 30px; display: block; }
.cabecera .entidad { color: var(--texto-2); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cabecera .espacio { flex: 1; }
.estado-guardado { font-size: .85rem; color: var(--texto-2); display: flex; align-items: center; gap: 6px; }
.punto { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.punto.aviso { background: var(--acento); }
.lateral { background: var(--superficie); border-right: 1px solid var(--borde); padding: 14px 10px; }
.lateral nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--texto); text-decoration: none; margin-bottom: 2px; }
.lateral nav a:hover { background: var(--superficie-2); }
.lateral nav a[aria-current="page"] { background: var(--primario-suave); color: var(--primario); font-weight: 600; }
.lateral svg { width: 18px; height: 18px; flex: none; }
.contenido-app { padding: 24px 28px 60px; max-width: 1200px; width: 100%; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .lateral { border-right: 0; border-bottom: 1px solid var(--borde); padding: 6px 8px; overflow-x: auto; }
  .lateral nav { display: flex; gap: 4px; }
  .lateral nav a { white-space: nowrap; margin: 0; }
  .contenido-app { padding: 18px 16px 60px; }
  .estado-guardado .texto-estado { display: none; }
  .cabecera .entidad { display: none; }
}

/* componentes */
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; box-shadow: var(--sombra); margin-bottom: 18px; }
.rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 18px; }
.kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px 18px; box-shadow: var(--sombra); }
.kpi .valor { font-size: 1.7rem; font-weight: 700; color: var(--primario); font-variant-numeric: tabular-nums; }
.kpi .etiqueta { color: var(--texto-2); font-size: .9rem; }
.titulo-pagina { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.titulo-pagina h1 { margin: 0; flex: 1; min-width: 200px; }
.barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.barra .crece { flex: 1; min-width: 200px; }

button, .boton { font: inherit; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 40px; }
button:hover, .boton:hover { background: var(--superficie-2); }
button.principal, .boton.principal { background: var(--primario); color: var(--primario-texto); border-color: var(--primario); font-weight: 600; }
button.principal:hover { filter: brightness(1.08); }
button.peligro { color: var(--error); border-color: var(--error); }
button.peligro.principal { background: var(--error); color: #fff; }
button.mini { min-height: 32px; padding: 4px 10px; font-size: .9rem; }
button:disabled { opacity: .5; cursor: not-allowed; }
button svg { width: 16px; height: 16px; }

label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
.campo { margin-bottom: 12px; }
.campo .ayuda { font-size: .85rem; color: var(--texto-2); margin-top: 3px; }
.campo .error-campo { font-size: .85rem; color: var(--error); margin-top: 3px; }
input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); min-height: 40px; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; min-height: 0; vertical-align: middle; accent-color: var(--primario); }
textarea { min-height: 80px; }
input[aria-invalid="true"] { border-color: var(--error); }
.casilla { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.columnas { display: grid; gap: 0 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
fieldset { border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 16px 4px; margin: 0 0 16px; }
legend { font-weight: 700; padding: 0 6px; color: var(--primario); }

.tabla-envoltorio { overflow-x: auto; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
th { background: var(--superficie-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
th button.orden { all: unset; cursor: pointer; }
tbody tr:hover { background: var(--superficie-2); }
tbody tr.clicable { cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.vacio { padding: 30px; text-align: center; color: var(--texto-2); }

.etiqueta-estado { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.e-ok { background: var(--ok-suave); color: var(--ok); }
.e-aviso { background: var(--aviso-suave); color: var(--aviso); }
.e-error { background: var(--error-suave); color: var(--error); }
.e-neutro { background: var(--superficie-2); color: var(--texto-2); }

.aviso { border-radius: var(--radio); padding: 12px 16px; margin-bottom: 14px; border: 1px solid; display: flex; gap: 10px; align-items: flex-start; }
.aviso.info { background: var(--primario-suave); border-color: var(--primario); }
.aviso.atencion { background: var(--aviso-suave); border-color: var(--acento); }
.aviso.mal { background: var(--error-suave); border-color: var(--error); }
.aviso.bien { background: var(--ok-suave); border-color: var(--ok); }
.aviso > div { flex: 1; }
.aviso p:last-child { margin: 0; }

.pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin-bottom: 16px; }
.pestanas button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; }
.pestanas button[aria-selected="true"] { border-bottom-color: var(--primario); color: var(--primario); font-weight: 600; }

/* modal */
.fondo-modal { position: fixed; inset: 0; background: rgba(10, 15, 25, .55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--superficie); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.ancho { max-width: 920px; }
.modal header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
.modal header h2 { margin: 0; flex: 1; font-size: 1.15rem; }
.modal .cuerpo { padding: 18px 20px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
.modal footer .izq { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.tostadas { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.tostada { background: var(--texto); color: var(--fondo); padding: 12px 16px; border-radius: 10px; box-shadow: var(--sombra); max-width: 380px; }
.tostada.mal { background: var(--error); color: #fff; }

/* pantallas de acceso */
.acceso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.acceso .caja { width: 100%; max-width: 980px; }
.acceso .cabeza { text-align: center; margin-bottom: 24px; }
.acceso .cabeza svg { width: 56px; height: 56px; color: var(--primario); }
.acceso .marca-acceso { margin: 0 0 10px; display: flex; justify-content: center; }
.acceso .marca-acceso svg.marca-logo { width: auto; height: 76px; max-width: 100%; }
.acceso .opciones { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.acceso .estrecha { max-width: 440px; margin: 0 auto; }
.pie-acceso { text-align: center; color: var(--texto-2); font-size: .85rem; margin-top: 20px; }

.lista-avisos { list-style: none; padding: 0; margin: 0; }
.lista-avisos li { padding: 10px 0; border-bottom: 1px solid var(--borde); display: flex; gap: 10px; align-items: center; }
.lista-avisos li:last-child { border-bottom: 0; }
.texto-legal { background: var(--superficie-2); border-radius: 8px; padding: 14px; font-size: .92rem; white-space: pre-wrap; max-height: 360px; overflow: auto; }
.mono { font-family: ui-monospace, Consolas, monospace; }
.derecha { text-align: right; }
.gris { color: var(--texto-2); }
.fila-acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* impresión */
#imprimir { display: none; }
@media print {
  body > *:not(#imprimir) { display: none !important; }
  #imprimir { display: block; color: #000; font: 11pt/1.4 Arial, sans-serif; }
  #imprimir h1 { font-size: 16pt; } #imprimir table { font-size: 9.5pt; } #imprimir th { background: #eee; position: static; }
  #imprimir th, #imprimir td { border: 1px solid #999; padding: 4px 6px; }
  .salto { page-break-after: always; }
  .carnes { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
  .tarjetas-sitio { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .tarjeta-sitio { border: 1.5px dashed #555; height: 82mm; padding: 6mm; display: flex; flex-direction: column; gap: 2mm; break-inside: avoid; font-size: 10.5pt; }
  .tarjeta-sitio .ts-cab { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 2mm; }
  .tarjeta-sitio .ts-cab span { font-size: 14pt; font-weight: bold; }
  .tarjeta-sitio .ts-salida { font-size: 9.5pt; text-transform: uppercase; letter-spacing: .04em; }
  .tarjeta-sitio .ts-nombre { font-size: 15pt; font-weight: bold; margin-top: 3mm; }
  .tarjeta-sitio .ts-tipo { font-size: 13pt; border: 1px solid #333; padding: 2mm 3mm; margin-top: auto; text-align: center; font-weight: bold; }
  .tarjeta-sitio .ts-pie { display: flex; justify-content: space-between; font-size: 9pt; }
  .carne { border: 1px solid #333; border-radius: 4mm; height: 54mm; padding: 5mm; display: flex; flex-direction: column; justify-content: space-between; break-inside: avoid; }
  .aviso-impresion { font-size: 8pt; color: #444; margin-top: 8mm; }
  @page { margin: 14mm; }
}
.acceso .marca-acceso { --marca-hueco: var(--fondo); }
/* modo demostración */
.demo-etiqueta { background: var(--acento); color: #241d19; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.demo-acciones { display: flex; gap: 8px; align-items: center; }
.boton-enlace { display: inline-flex; align-items: center; text-decoration: none; border: 1px solid var(--borde); border-radius: 8px; padding: 6px 10px; color: var(--primario); font-size: .9rem; white-space: nowrap; }
@media (max-width: 560px) { .demo-acciones .boton-enlace { display: none; } }
.acceso .opciones-demo { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

/* llave de recuperación */
button.enlace { background: none; border: 0; padding: 0; min-height: 0; color: var(--primario); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
.llave-codigo { font-size: clamp(1.05rem, 4.2vw, 1.5rem); letter-spacing: .06em; text-align: center; padding: 14px 10px; border: 2px dashed var(--acento); border-radius: 10px; background: var(--superficie-2); word-break: break-all; user-select: all; }
#imprimir .hoja-llave { max-width: 160mm; margin: 0 auto; font-size: 11pt; }
#imprimir .hoja-llave h1 { font-size: 20pt; margin-bottom: 2mm; }
#imprimir .hoja-llave .ent { font-size: 13pt; margin-bottom: 8mm; }
#imprimir .hoja-llave .codigo { font: 700 20pt ui-monospace, Consolas, monospace; letter-spacing: .08em; border: 2px dashed #000; padding: 8mm 4mm; text-align: center; margin: 6mm 0; }
#imprimir .hoja-llave li { margin-bottom: 2mm; }
#imprimir .hoja-llave .firma { margin-top: 14mm; }
</style>
</head>

<script>/* Alcancía · utilidades generales (sin dependencias) */
'use strict';
var A = (typeof globalThis !== 'undefined' ? globalThis : window).A || {};
(typeof globalThis !== 'undefined' ? globalThis : window).A = A;

/* La aplicación necesita WebCrypto, que los navegadores solo activan en https (o en un fichero local).
   Si se abre la web por http, se pasa a https antes de nada. */
if (typeof location !== 'undefined' && location.protocol === 'http:' && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) {
  location.replace('https:' + location.href.slice(5));
}
A.puedeCifrar = function () { var c = (typeof globalThis !== 'undefined' && globalThis.crypto) || (typeof window !== 'undefined' && window.crypto); return !!(c && c.subtle); };

A.esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });

A.uid = function (prefijo) {
  var r = new Uint8Array(8);
  (globalThis.crypto || window.crypto).getRandomValues(r);
  return (prefijo || '') + Array.from(r, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
};

/* Importes: siempre en céntimos (enteros) para evitar errores de redondeo */
A.aCentimos = function (texto) {
  if (typeof texto === 'number') return Math.round(texto * 100);
  var t = String(texto || '').trim().replace(/\s|€/g, '');
  if (!t) return NaN;
  // admite 1.234,56 · 1234,56 · 1234.56
  if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  if (!/^-?\d+(\.\d{1,2})?$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
};
var FORMATO_EUROS = (typeof Intl !== 'undefined') ? new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true }) : null;
A.euros = function (cent) {
  var n = (cent || 0) / 100;
  return (FORMATO_EUROS ? FORMATO_EUROS.format(n) : n.toFixed(2).replace('.', ',')) + ' €';
};
A.decimalPunto = function (cent) {
  var s = String(Math.abs(cent));

  return (cent < 0 ? '-' : '') + s.slice(0, -2) + '.' + s.slice(-2);
};

/* Fechas en formato ISO (AAAA-MM-DD) */
A.hoyISO = function () { return A.fechaISO(new Date()); };
A.fechaISO = function (d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
A.fechaES = function (iso) {
  if (!iso) return '';
  var p = String(iso).slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
};
/* Convierte dd/mm/aaaa, d/m/aa o aaaa-mm-dd a ISO; '' si no es válida */
A.parseFecha = function (t) {
  t = String(t || '').trim();
  if (!t) return '';
  var m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  var y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (!m) return '';
    d = +m[1]; mo = +m[2]; y = +m[3];
    if (y < 100) y += y > 50 ? 1900 : 2000;
  }

  /* Cabecera: etiqueta de demo, reiniciar y enlace a la aplicación real (sin bloqueo, que aquí no tiene sentido) */
  var pintarOriginal = A.pintar;
  A.pintar = async function () {
    await pintarOriginal();
    var cab = A.$('.cabecera'); if (!cab) return;
    if (A.S.demoEnMemoria) { var est = A.$('.estado-guardado', cab); if (est) est.innerHTML = '<span class="punto aviso"></span><span class="texto-estado">Solo en memoria</span>'; }
    if (A.$('.demo-acciones', cab)) return;
    var bl = A.$('#b-bloquear', cab); if (bl) bl.remove();
    var marca = A.$('.marca', cab);
    marca.insertAdjacentHTML('afterend', '<span class="demo-etiqueta" title="Datos inventados">Demo</span>');
    cab.insertAdjacentHTML('beforeend', '<span class="demo-acciones"><button class="mini" type="button" id="b-reiniciar-demo">Reiniciar</button>' +
      '<a class="mini boton-enlace" href="../app/">Usar con mis datos</a></span>');
    A.$('#b-reiniciar-demo', cab).addEventListener('click', function () { A.reiniciarDemo(); });
  };
  A.bloquearSesion = async function () { await A.guardarAhora(); };
})(A);
</script>
