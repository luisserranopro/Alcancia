<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Alcancía: gestión de socios, cuotas y remesas SEPA para asociaciones, hermandades, AMPAs y clubes. Funciona sin conexión y los datos no salen del ordenador.">
<meta name="theme-color" content="#a8432a">
<title>Demostración · Alcancía</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100.0 100.0%22 width=%22100%22 height=%22100%22%3E%3Ctitle%3EAlcanc%C3%ADa%3C/title%3E%3Crect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23b24a2a%22/%3E%3Cg transform=%22translate%2815 15%29 scale%28.7%29%22%3E%3Cdefs%3E%3CclipPath id=%22ranura-a%22%3E%3Crect x=%220%22 y=%220%22 width=%22100%22 height=%2231%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cpath fill=%22%23ffffff%22 d=%22M34.6 87.2A33 33 0 1 1 65.4 87.2Z%22/%3E%3Crect x=%2237%22 y=%2284.5%22 width=%2226%22 height=%229%22 rx=%223.5%22 fill=%22%23ffffff%22/%3E%3Cg clip-path=%22url%28%23ranura-a%29%22%3E%3Ccircle cx=%2250%22 cy=%2221%22 r=%2213.2%22 fill=%22%23b24a2a%22/%3E%3Ccircle cx=%2250%22 cy=%2221%22 r=%2210.6%22 fill=%22%23e3a51f%22/%3E%3C/g%3E%3Cpath d=%22M37.5 32.5H62.5%22 stroke=%22%23b24a2a%22 stroke-width=%224.6%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E">
<script>window.ALCANCIA_DEMO = true; window.ASOCIA_SIN_SW = true;</script>
<style>:root {
  /* Identidad Alcancía: barro (terracota), moneda (oro) y tinta cálida */
  --fondo: #f7f4f0; --superficie: #ffffff; --superficie-2: #f2ede7; --borde: #e2d8ce; --texto: #241d19; --texto-2: #65584e;
  --primario: #a8432a; --primario-texto: #ffffff; --primario-suave: #f8e8e0; --acento: #d9971a;
  --marca-barro: #b24a2a; --marca-moneda: #e3a51f; --marca-canto: #b97f0c; --marca-tinta: #241d19; --marca-hueco: var(--superficie);
  --ok: #1e7a4c; --ok-suave: #e3f3ea; --aviso: #8a5a00; --aviso-suave: #fff3d6; --error: #b3261e; --error-suave: #fde8e7;
  --radio: 10px; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --fuente: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #16120f; --superficie: #201a16; --superficie-2: #2a221d; --borde: #3d322a; --texto: #f2ebe5; --texto-2: #bcaea2;
    --primario: #f0906c; --primario-texto: #2a0f05; --primario-suave: #3d2219; --acento: #f2c35a;
    --marca-barro: #f0906c; --marca-moneda: #f2c35a; --marca-tinta: #f3ece6;
    --ok: #6fd3a0; --ok-suave: #173327; --aviso: #f3c46a; --aviso-suave: #3a2f17; --error: #ff8a80; --error-suave: #3d1d1b;
    color-scheme: dark;
  }
}
:root[data-tema="oscuro"] {
  --fondo: #16120f; --superficie: #201a16; --superficie-2: #2a221d; --borde: #3d322a; --texto: #f2ebe5; --texto-2: #bcaea2;
  --primario: #f0906c; --primario-texto: #2a0f05; --primario-suave: #3d2219; --acento: #f2c35a;
  --marca-barro: #f0906c; --marca-moneda: #f2c35a; --marca-tinta: #f3ece6;
  --ok: #6fd3a0; --ok-suave: #173327; --aviso: #f3c46a; --aviso-suave: #3a2f17; --error: #ff8a80; --error-suave: #3d1d1b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--fondo); color: var(--texto); font: 16px/1.5 var(--fuente); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .6em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
a { color: var(--primario); }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
.oculto { display: none !important; }
td.num { white-space: nowrap; }
details.historial { margin-top: 8px; border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; }
details.historial summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; }
details.historial[open] summary { margin-bottom: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* estructura */
.app { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
.cabecera { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--superficie); border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 5; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--primario); text-decoration: none; }
.marca svg.marca-logo { width: auto; height: 30px; display: block; }
.cabecera .entidad { color: var(--texto-2); font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cabecera .espacio { flex: 1; }
.estado-guardado { font-size: .85rem; color: var(--texto-2); display: flex; align-items: center; gap: 6px; }
.punto { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.punto.aviso { background: var(--acento); }
.lateral { background: var(--superficie); border-right: 1px solid var(--borde); padding: 14px 10px; }
.lateral nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--texto); text-decoration: none; margin-bottom: 2px; }
.lateral nav a:hover { background: var(--superficie-2); }
.lateral nav a[aria-current="page"] { background: var(--primario-suave); color: var(--primario); font-weight: 600; }
.lateral svg { width: 18px; height: 18px; flex: none; }
.contenido-app { padding: 24px 28px 60px; max-width: 1200px; width: 100%; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { border-right: 0; border-bottom: 1px solid var(--borde); padding: 6px 8px; overflow-x: auto; }
  .lateral nav { display: flex; gap: 4px; }
  .lateral nav a { white-space: nowrap; margin: 0; }
  .contenido-app { padding: 18px 16px 60px; }
  .estado-guardado .texto-estado { display: none; }
  .cabecera .entidad { display: none; }
}

/* componentes */
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; box-shadow: var(--sombra); margin-bottom: 18px; }
.rejilla { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-bottom: 18px; }
.kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px 18px; box-shadow: var(--sombra); }
.kpi .valor { font-size: 1.7rem; font-weight: 700; color: var(--primario); font-variant-numeric: tabular-nums; }
.kpi .etiqueta { color: var(--texto-2); font-size: .9rem; }
.titulo-pagina { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.titulo-pagina h1 { margin: 0; flex: 1; min-width: 200px; }
.barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.barra .crece { flex: 1; min-width: 200px; }

button, .boton { font: inherit; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; min-height: 40px; }
button:hover, .boton:hover { background: var(--superficie-2); }
button.principal, .boton.principal { background: var(--primario); color: var(--primario-texto); border-color: var(--primario); font-weight: 600; }
button.principal:hover { filter: brightness(1.08); }
button.peligro { color: var(--error); border-color: var(--error); }
button.peligro.principal { background: var(--error); color: #fff; }
button.mini { min-height: 32px; padding: 4px 10px; font-size: .9rem; }
button:disabled { opacity: .5; cursor: not-allowed; }
button svg { width: 16px; height: 16px; }

label { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
.campo { margin-bottom: 12px; }
.campo .ayuda { font-size: .85rem; color: var(--texto-2); margin-top: 3px; }
.campo .error-campo { font-size: .85rem; color: var(--error); margin-top: 3px; }
input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borde); background: var(--superficie); color: var(--texto); min-height: 40px; }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; min-height: 0; vertical-align: middle; accent-color: var(--primario); }
textarea { min-height: 80px; }
input[aria-invalid="true"] { border-color: var(--error); }
.casilla { display: flex; gap: 8px; align-items: center; font-weight: 400; }
.columnas { display: grid; gap: 0 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
fieldset { border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 16px 4px; margin: 0 0 16px; }
legend { font-weight: 700; padding: 0 6px; color: var(--primario); }

.tabla-envoltorio { overflow-x: auto; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
th { background: var(--superficie-2); font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
th button.orden { all: unset; cursor: pointer; }
tbody tr:hover { background: var(--superficie-2); }
tbody tr.clicable { cursor: pointer; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.vacio { padding: 30px; text-align: center; color: var(--texto-2); }

.etiqueta-estado { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.e-ok { background: var(--ok-suave); color: var(--ok); }
.e-aviso { background: var(--aviso-suave); color: var(--aviso); }
.e-error { background: var(--error-suave); color: var(--error); }
.e-neutro { background: var(--superficie-2); color: var(--texto-2); }

.aviso { border-radius: var(--radio); padding: 12px 16px; margin-bottom: 14px; border: 1px solid; display: flex; gap: 10px; align-items: flex-start; }
.aviso.info { background: var(--primario-suave); border-color: var(--primario); }
.aviso.atencion { background: var(--aviso-suave); border-color: var(--acento); }
.aviso.mal { background: var(--error-suave); border-color: var(--error); }
.aviso.bien { background: var(--ok-suave); border-color: var(--ok); }
.aviso > div { flex: 1; }
.aviso p:last-child { margin: 0; }

.pestanas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin-bottom: 16px; overflow-x: auto; }
.pestanas button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; }
.pestanas button[aria-selected="true"] { border-bottom-color: var(--primario); color: var(--primario); font-weight: 600; }

/* modal */
.fondo-modal { position: fixed; inset: 0; background: rgba(10, 15, 25, .55); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--superficie); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.ancho { max-width: 920px; }
.modal header { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
.modal header h2 { margin: 0; flex: 1; font-size: 1.15rem; }
.modal .cuerpo { padding: 18px 20px; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--borde); flex-wrap: wrap; }
.modal footer .izq { margin-right: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.tostadas { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.tostada { background: var(--texto); color: var(--fondo); padding: 12px 16px; border-radius: 10px; box-shadow: var(--sombra); max-width: 380px; }
.tostada.mal { background: var(--error); color: #fff; }

/* pantallas de acceso */
.acceso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.acceso .caja { width: 100%; max-width: 980px; }
.acceso .cabeza { text-align: center; margin-bottom: 24px; }
.acceso .cabeza svg { width: 56px; height: 56px; color: var(--primario); }
.acceso .marca-acceso { margin: 0 0 10px; display: flex; justify-content: center; }
.acceso .marca-acceso svg.marca-logo { width: auto; height: 76px; max-width: 100%; }
.acceso .opciones { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.acceso .estrecha { max-width: 440px; margin: 0 auto; }
.pie-acceso { text-align: center; color: var(--texto-2); font-size: .85rem; margin-top: 20px; }

.lista-avisos { list-style: none; padding: 0; margin: 0; }
.lista-avisos li { padding: 10px 0; border-bottom: 1px solid var(--borde); display: flex; gap: 10px; align-items: center; }
.lista-avisos li:last-child { border-bottom: 0; }
.texto-legal { background: var(--superficie-2); border-radius: 8px; padding: 14px; font-size: .92rem; white-space: pre-wrap; max-height: 360px; overflow: auto; }
.mono { font-family: ui-monospace, Consolas, monospace; }
.derecha { text-align: right; }
.gris { color: var(--texto-2); }
.fila-acciones { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* impresión */
#imprimir { display: none; }
@media print {
  body > *:not(#imprimir) { display: none !important; }
  #imprimir { display: block; color: #000; font: 11pt/1.4 Arial, sans-serif; }
  #imprimir h1 { font-size: 16pt; } #imprimir table { font-size: 9.5pt; } #imprimir th { background: #eee; position: static; }
  #imprimir th, #imprimir td { border: 1px solid #999; padding: 4px 6px; }
  .salto { page-break-after: always; }
  .hoja-tramo { break-after: page; } .hoja-tramo:last-of-type { break-after: auto; } .bloque-tramo { break-inside: avoid-page; }
  .certificado { break-after: page; font-size: 11pt; line-height: 1.55; }
  .certificado:last-of-type { break-after: auto; }
  .certificado h2 { font-size: 14pt; margin: 0 0 6mm; }
  .certificado .donante { margin: 4mm 0 4mm 8mm; }
  .certificado table { width: 100%; border-collapse: collapse; margin: 4mm 0; }
  .certificado th { text-align: left; width: 35%; }
  .firmas { display: flex; justify-content: space-between; gap: 10mm; margin-top: 14mm; }
  .firmas > div { flex: 1; }
  .carnes { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; }
  .tarjetas-sitio { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .tarjeta-sitio { border: 1.5px dashed #555; height: 82mm; padding: 6mm; display: flex; flex-direction: column; gap: 2mm; break-inside: avoid; font-size: 10.5pt; }
  .tarjeta-sitio .ts-cab { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 2mm; }
  .tarjeta-sitio .ts-cab span { font-size: 14pt; font-weight: bold; }
  .tarjeta-sitio .ts-salida { font-size: 9.5pt; text-transform: uppercase; letter-spacing: .04em; }
  .tarjeta-sitio .ts-nombre { font-size: 15pt; font-weight: bold; margin-top: 3mm; }
  .tarjeta-sitio .ts-tipo { font-size: 13pt; border: 1px solid #333; padding: 2mm 3mm; margin-top: auto; text-align: center; font-weight: bold; }
  .tarjeta-sitio .ts-pie { display: flex; justify-content: space-between; font-size: 9pt; }
  .carne { border: 1px solid #333; border-radius: 4mm; height: 54mm; padding: 5mm; display: flex; flex-direction: column; justify-content: space-between; break-inside: avoid; }
  .aviso-impresion { font-size: 8pt; color: #444; margin-top: 8mm; }
  @page { margin: 14mm; }
}
.acceso .marca-acceso { --marca-hueco: var(--fondo); }
/* modo demostración */
.demo-etiqueta { background: var(--acento); color: #241d19; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.demo-acciones { display: flex; gap: 8px; align-items: center; }
.boton-enlace { display: inline-flex; align-items: center; text-decoration: none; border: 1px solid var(--borde); border-radius: 8px; padding: 6px 10px; color: var(--primario); font-size: .9rem; white-space: nowrap; }
@media (max-width: 560px) { .demo-acciones .boton-enlace { display: none; } }
.acceso .opciones-demo { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

/* llave de recuperación */
button.enlace { background: none; border: 0; padding: 0; min-height: 0; color: var(--primario); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
.llave-codigo { font-size: clamp(1.05rem, 4.2vw, 1.5rem); letter-spacing: .06em; text-align: center; padding: 14px 10px; border: 2px dashed var(--acento); border-radius: 10px; background: var(--superficie-2); word-break: break-all; user-select: all; }
#imprimir .hoja-llave { max-width: 160mm; margin: 0 auto; font-size: 11pt; }
#imprimir .hoja-llave h1 { font-size: 20pt; margin-bottom: 2mm; }
#imprimir .hoja-llave .ent { font-size: 13pt; margin-bottom: 8mm; }
#imprimir .hoja-llave .codigo { font: 700 20pt ui-monospace, Consolas, monospace; letter-spacing: .08em; border: 2px dashed #000; padding: 8mm 4mm; text-align: center; margin: 6mm 0; }
#imprimir .hoja-llave li { margin-bottom: 2mm; }
#imprimir .hoja-llave .firma { margin-top: 14mm; }

/* el contenido nunca ensancha la página: las tablas se desplazan dentro de su envoltorio */
.contenido-app { min-width: 0; }
.barra > * { min-width: 0; max-width: 100%; }
.barra .crece { flex: 1 1 220px; }
select, input, textarea { max-width: 100%; }
.app { overflow-x: clip; }
.tabla-envoltorio { position: relative; }

/* escudo de la entidad */
.cabecera .entidad { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cabecera .entidad span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.escudo-cabecera { height: 28px; width: auto; max-width: 48px; object-fit: contain; flex: none; }
.bloque-escudo { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.bloque-escudo > div { min-width: 0; }
.vista-escudo { width: 120px; height: 120px; border: 1px dashed var(--borde); border-radius: var(--radio); display: grid; place-items: center; background: var(--superficie-2); flex: none; }
.vista-escudo img { max-width: 104px; max-height: 104px; object-fit: contain; }
#imprimir .cab-impresion { display: flex; align-items: center; gap: 6mm; margin-bottom: 4mm; }
#imprimir .cab-impresion h1 { margin: 0 0 1mm; }
#imprimir .cab-impresion p { margin: 0; }
#imprimir .escudo-impresion { height: 22mm; width: auto; max-width: 30mm; object-fit: contain; }
#imprimir .cab-certificado { display: flex; align-items: center; gap: 5mm; margin-bottom: 6mm; font-size: 12pt; }
#imprimir .escudo-mini { height: 9mm; width: auto; max-width: 14mm; object-fit: contain; vertical-align: middle; margin-right: 2mm; }
#imprimir .carne-cab { display: flex; align-items: center; }
#imprimir .ts-ent { display: flex; align-items: center; }
@media (max-width: 860px) { .cabecera .entidad { display: none; } }
.campo.sin-etiqueta { margin: 0; } .campo.sin-etiqueta label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.campo.sin-etiqueta .error-campo { display: none; }
.tramo .titulo-tramo { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 10px; }
.tramo .titulo-tramo > div:first-child { min-width: 0; }
.tramo h2 { margin-bottom: 2px; } .tramo .titulo-tramo p { margin: 0; }
</style>
</head>
<body>
<noscript><p style="padding:20px">Alcancía necesita JavaScript activado.</p></noscript>
<div id="app"></div>
<div id="imprimir" aria-hidden="true"></div>
<script>/* Alcancía · utilidades generales (sin dependencias) */
'use strict';
var A = (typeof globalThis !== 'undefined' ? globalThis : window).A || {};
(typeof globalThis !== 'undefined' ? globalThis : window).A = A;

/* La aplicación necesita WebCrypto, que los navegadores solo activan en https (o en un fichero local).
   Si se abre la web por http, se pasa a https antes de nada. */
if (typeof location !== 'undefined' && location.protocol === 'http:' && !/^(localhost|127\.|\[::1\])/.test(location.hostname)) {

      '<div style="padding-bottom:12px" class="fila-acciones"><button data-accion="editar">Editar</button><button data-accion="cerrar">' + (cerrada ? 'Reabrir' : 'Cerrar') + '</button>' +
      '<button data-accion="borrar" class="peligro">Borrar</button></div></div>' +
      '<p class="gris">' + A.esc(A.TIPOS_ACTIVIDAD[a.tipo] || '') + (a.lugar ? ' · ' + A.esc(a.lugar) : '') + (a.fechaFin ? ' · del ' + A.fechaES(a.fecha) + ' al ' + A.fechaES(a.fechaFin) : '') +
      (loteria ? ' · Número' + (/[,;\s]/.test(a.numeros || '') ? 's' : '') + ' ' + A.esc(a.numeros || '—') + ' · participación de ' + A.euros(a.precioCent) + (a.donativoCent ? ' (' + A.euros(a.donativoCent) + ' de donativo)' : '')
        : ' · ' + a.precios.map(function (p) { return A.esc(p.nombre) + ' ' + A.euros(p.importeCent); }).join(' · ') + (a.plazas ? ' · ' + a.plazas + ' plazas' : '')) + '</p>' +
      (cerrada ? '<div class="aviso info">' + A.icono('candado', 20) + '<div><p>Actividad cerrada: se puede consultar y cobrar lo pendiente, pero no inscribir.</p></div></div>' : '') +
      '<div class="pestanas" role="tablist">' + (loteria ? [['talonarios', 'Talonarios'], ['resumen', 'Resumen']] : [['inscripciones', 'Inscripciones'], ['resumen', 'Resumen y listados']]).map(function (p) {
        return '<button role="tab" aria-selected="' + (pest === p[0]) + '" data-pest="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div><div id="contenido-actividad"></div>';
    A.$('select[name=actSel]', c).addEventListener('change', function (e) { A.ir('actividades?id=' + e.target.value); });
    c.addEventListener('click', function (e) {
      var b = e.target.closest('[data-pest]'); if (b) return A.ir('actividades?id=' + a.id + '&pestana=' + b.getAttribute('data-pest'));
      var x = e.target.closest('[data-accion]'); if (!x) return;
      var acc = x.getAttribute('data-accion');
      if (acc === 'nueva') dialogoActividad(db, null);
      if (acc === 'editar') dialogoActividad(db, a);
      if (acc === 'cerrar') { A.cerrarActividad(db, a.id, !cerrada); A.guardar(); A.pintar(); }
      if (acc === 'borrar') A.confirmar('Borrar actividad', 'Se borrará «' + a.nombre + '». Solo es posible si no tiene inscripciones ni talonarios.', 'Borrar', true).then(function (ok) {
        if (!ok) return; try { A.borrarActividad(db, a.id); A.guardar(); A.ir('actividades'); } catch (err) { A.toast(err.message, 'mal'); }
      });
    });
    var cont = A.$('#contenido-actividad', c);
    if (loteria) return pest === 'resumen' ? resumenLoteria(cont, db, a) : talonarios(cont, db, a, v);
    if (pest === 'resumen') return resumen(cont, db, a, v);
    inscripciones(cont, db, a, v, params);
  };

  /* ---------- actividad: alta y edición ---------- */
  function dialogoActividad(db, a) {
    var x = a || { nombre: '', tipo: 'excursion', fecha: '', fechaFin: '', lugar: '', plazas: 0, observaciones: '', precios: [{ id: A.uid('p'), nombre: A.vocab(db).Miembros, importeCent: 0 }, { id: A.uid('p'), nombre: 'No ' + A.vocab(db).miembros, importeCent: 0 }], precioCent: 500, donativoCent: 100, porTalonario: 50, numeros: '' };
    var precios = JSON.parse(JSON.stringify(x.precios || []));
    var filaPrecio = function (p) { return '<div class="barra fila-precio" data-id="' + p.id + '"><div class="crece">' + A.campo('pn', 'Precio', p.nombre) + '</div><div>' +
      A.campo('pi', 'Importe (€)', p.importeCent ? A.decimalPunto(p.importeCent).replace('.', ',') : '', { attrs: ' inputmode="decimal"' }) + '</div><div style="padding-bottom:12px"><button type="button" class="mini" data-quitar>Quitar</button></div></div>'; };
    A.modal({ titulo: a ? 'Editar actividad' : 'Nueva actividad', ancho: true, html: '<form id="f-act" novalidate><div class="columnas">' +
      A.campo('nombre', 'Nombre', x.nombre, { requerido: true, ph: 'Excursión a la granja escuela, Lotería de Navidad…' }) +
      A.campo('tipo', 'Tipo', x.tipo, { opciones: Object.keys(A.TIPOS_ACTIVIDAD).map(function (k) { return [k, A.TIPOS_ACTIVIDAD[k]]; }) }) +
      A.campo('fecha', 'Fecha', x.fecha, { tipo: 'date' }) + '<div class="no-loteria">' + A.campo('fechaFin', 'Hasta (si dura varios días)', x.fechaFin, { tipo: 'date' }) + '</div>' +
      '<div class="no-loteria">' + A.campo('lugar', 'Lugar', x.lugar) + '</div><div class="no-loteria">' + A.campo('plazas', 'Plazas (0 = sin límite)', x.plazas || 0, { tipo: 'number', attrs: ' min="0"' }) + '</div></div>' +
      '<fieldset class="no-loteria"><legend>Precios</legend><div id="precios">' + precios.map(filaPrecio).join('') + '</div><button type="button" class="mini" id="b-precio">' + A.icono('mas') + ' Añadir precio</button></fieldset>' +
      '<fieldset class="si-loteria"><legend>Lotería</legend><div class="columnas">' + A.campo('numeros', 'Número(s) que se juegan', x.numeros, { ph: '12345, 67890' }) +
      A.campo('precio', 'Precio de cada participación (€)', A.decimalPunto(x.precioCent || 0).replace('.', ','), { attrs: ' inputmode="decimal"' }) +
      A.campo('donativo', 'De ello, donativo para la entidad (€)', A.decimalPunto(x.donativoCent || 0).replace('.', ','), { attrs: ' inputmode="decimal"', ayuda: 'Por ejemplo, participación de 5 € que juega 4 €: donativo 1 €.' }) +
      A.campo('porTalonario', 'Participaciones por talonario', x.porTalonario || 50, { tipo: 'number', attrs: ' min="1"' }) + '</div></fieldset>' +
      A.campo('observaciones', 'Observaciones', x.observaciones, { tipo: 'textarea' }) + '</form>',
      alAbrir: function (r) {
        var ver = function () { var lot = A.$('select[name=tipo]', r).value === 'loteria'; A.$$('.no-loteria', r).forEach(function (e) { e.classList.toggle('oculto', lot); }); A.$$('.si-loteria', r).forEach(function (e) { e.classList.toggle('oculto', !lot); }); };
        ver(); A.$('select[name=tipo]', r).addEventListener('change', ver);
        A.$('#b-precio', r).addEventListener('click', function () { A.$('#precios', r).insertAdjacentHTML('beforeend', filaPrecio({ id: A.uid('p'), nombre: '', importeCent: 0 })); });
        A.$('#precios', r).addEventListener('click', function (e) { if (e.target.closest('[data-quitar]')) e.target.closest('.fila-precio').remove(); });
      },
      botones: [{ texto: 'Cancelar', valor: false }, { texto: 'Guardar', valor: true, clase: 'principal', antes: function (r) {
        var f = A.leerForm(A.$('#f-act', r));
        var ps = A.$$('.fila-precio', r).map(function (el) {
          return { id: el.getAttribute('data-id'), nombre: A.$('input[name=pn]', el).value.trim() || 'General', importeCent: A.aCentimos(A.$('input[name=pi]', el).value) || 0 };
        });
        if (f.tipo !== 'loteria' && !ps.length) throw new Error('Añade al menos un precio.');
        var precio = A.aCentimos(f.precio) || 0, don = A.aCentimos(f.donativo) || 0;
        if (f.tipo === 'loteria' && !(precio > 0)) throw new Error('Indica el precio de la participación.');
        if (don > precio) throw new Error('El donativo no puede ser mayor que el precio.');
        var g = A.guardarActividad(db, { id: a && a.id, nombre: f.nombre, tipo: f.tipo, fecha: f.fecha, fechaFin: f.fechaFin, lugar: f.lugar, plazas: f.plazas, observaciones: f.observaciones,
          precios: f.tipo === 'loteria' ? [] : ps, numeros: f.numeros, precioCent: precio, donativoCent: don, porTalonario: f.porTalonario });
        dialogoActividad.ultima = g.id; A.guardar();
      } }] }).then(function (r) { if (r) A.ir('actividades?id=' + dialogoActividad.ultima); });
  }

  /* ---------- inscripciones ---------- */
  function inscripciones(cont, db, a, v, params) {
    var abierta = a.estado === 'abierta';
    cont.innerHTML = '<div class="barra"><div class="crece">' + A.campo('texto', 'Buscar', fi.texto, { tipo: 'search', ph: 'Nombre, ' + v.numero.toLowerCase() + ' o detalle' }) + '</div>' +
      '<div>' + A.campo('estado', 'Estado', fi.estado, { opciones: [['vigentes', 'Inscritos (sin anulados)'], ['debe', 'Con pagos pendientes'], ['pagada', 'Pagadas'], ['anulada', 'Anuladas'], ['', 'Todas']] }) + '</div>' +
      '<div style="padding-bottom:12px"><button class="principal" data-inscribir' + (abierta ? '' : ' disabled') + '>' + A.icono('mas') + ' Inscribir</button></div></div><div id="lista-insc"></div>';
    var lista = function () {
      var t = A.normaliza(fi.texto);
      var filas = A.listadoInscripciones(db, a.id, { estado: fi.estado }).filter(function (y) {
        return !t || [A.nombreInscrito(db, y.x), y.m && y.m.numero, y.x.detalle].some(function (z) { return A.normaliza(z).indexOf(t) >= 0; });
      });

      A.$('#lista-insc', cont).innerHTML = '<p class="gris" aria-live="polite">' + r.inscritos + ' inscritos' + (a.plazas ? ' de ' + a.plazas + ' plazas' : '') + ' · cobrado ' + A.euros(r.cobradoCent) + ' · pendiente ' + A.euros(r.pendienteCent) + '</p>' +
        (filas.length ? '<div class="tabla-envoltorio"><table><thead><tr><th>Nombre</th><th>Detalle</th><th>Precio</th><th class="num">Importe</th><th>Estado</th><th><span class="sr">Acciones</span></th></tr></thead><tbody>' +
        filas.slice(0, 500).map(function (y) {
          var x = y.x, acc = (x.estado === 'pendiente' || x.estado === 'parcial') ? '<button class="mini" data-cobrar="' + x.id + '">Cobrar</button>' : '';
          return '<tr class="clicable" data-insc="' + x.id + '" tabindex="0"><td>' + (y.m ? A.esc(y.m.numero) + ' · ' : '') + A.esc(A.nombreInscrito(db, x)) + '</td><td>' + A.esc(x.detalle) + '</td><td>' + A.esc(x.precioNombre) + '</td>' +
            '<td class="num">' + A.euros(x.importeCent) + '</td><td>' + A.etiquetaInscripcion(x) + '</td><td><div class="fila-acciones">' + acc + '</div></td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="tarjeta vacio">No hay inscripciones con estos filtros.</div>');
    };
    lista();
    A.$('input[name=texto]', cont).addEventListener('input', A.debounce(function (e) { fi.texto = e.target.value; lista(); }, 150));
    A.$('select[name=estado]', cont).addEventListener('change', function (e) { fi.estado = e.target.value; lista(); });
    cont.addEventListener('click', function (e) {

      if ((b = e.target.closest('[data-cobrar]'))) return dialogoCobro(db, b.getAttribute('data-cobrar'));
      if (e.target.closest('[data-inscribir]')) return A.dialogoInscribir(db, a.id, null);
      if ((b = e.target.closest('tr[data-insc]'))) return dialogoInscripcion(db, b.getAttribute('data-insc'));
    });
    if (params.inscribir && abierta) A.dialogoInscribir(db, a.id, params.inscribir);
  }

  A.dialogoInscribir = function (db, actividadId, miembroId) {
    var a = A.actividadPorId(db, actividadId), v = A.vocab(db);
    A.modal({ titulo: 'Inscribir en ' + a.nombre, html: '<form id="f-insc" novalidate>' +
      A.campo('miembro', v.Miembro, miembroId || '', { opciones: [['', 'No es ' + v.miembro + ' (escribir nombre)']].concat(opcionesMiembros(db)) }) +
      '<div class="columnas externo">' + A.campo('nombre', 'Nombre y apellidos', '') + A.campo('telefono', 'Teléfono', '') + '</div>' +
      A.campo('detalle', 'Detalle (opcional)', '', { ph: db.entidad.perfil === 'ampa' ? 'Nombre del alumno y curso' : 'Talla, menú, acompañante…' }) +
      '<div class="columnas">' + A.campo('precio', 'Precio', a.precios[0].id, { opciones: a.precios.map(function (p) { return [p.id, p.nombre + ' · ' + A.euros(p.importeCent)]; }) }) +
      A.campo('importe', 'Importe (€)', A.decimalPunto(a.precios[0].importeCent).replace('.', ','), { attrs: ' inputmode="decimal"', ayuda: 'Se puede ajustar (descuento por hermanos, beca…).' }) +
      A.campo('pago', 'Paga ahora (€)', '', { attrs: ' inputmode="decimal"', ayuda: 'Déjalo vacío si paga más tarde; puede pagar en varios plazos.' }) +

        };

        pr.addEventListener('change', function () { var p = a.precios.find(function (x) { return x.id === pr.value; }); A.$('input[name=importe]', r).value = A.decimalPunto(p.importeCent).replace('.', ','); });
      },
      botones: [{ texto: 'Cancelar', valor: false }, { texto: 'Inscribir y otra', valor: 'otra', antes: guardar }, { texto: 'Inscribir', valor: true, clase: 'principal', antes: guardar }] })
      .then(function (r) { if (r === 'otra') { A.pintar(); A.dialogoInscribir(db, actividadId, null); } else if (r) A.pintar(); });
    function guardar(r) {

        importeCent: A.aCentimos(f.importe) || 0, pagoCent: A.aCentimos(f.pago) || 0, formaPago: f.forma });
      A.guardar(); A.toast('Inscripción registrada.');
    }
  };

  function dialogoCobro(db, id) {
    var x = A.inscripcionPorId(db, id), pend = x.importeCent - (x.pagadoCent || 0);
    A.modal({ titulo: 'Cobrar · ' + A.nombreInscrito(db, x), html: '<form id="f-cob" class="columnas" novalidate>' +

      botones: [{ texto: 'Cancelar', valor: false }, { texto: 'Cobrar', valor: true, clase: 'principal', antes: function (r) {
        var f = A.leerForm(A.$('#f-cob', r));

  }

  function dialogoInscripcion(db, id) {
    var x = A.inscripcionPorId(db, id);
    A.modal({ titulo: A.nombreInscrito(db, x), html: '<p>' + A.esc(x.precioNombre) + ' · ' + A.euros(x.importeCent) + ' · ' + A.etiquetaInscripcion(x) + (x.detalle ? ' · ' + A.esc(x.detalle) : '') + (x.telefono ? ' · ' + A.esc(x.telefono) : '') + '</p>' +

      botones: [x.estado === 'anulada' ? { texto: 'Reactivar', valor: 'reabrir', izq: true } : { texto: 'Anular inscripción', valor: 'anular', clase: 'peligro', izq: true },

  function resumen(cont, db, a, v) {

      A.kpi(A.euros(r.pendienteCent), 'Pendiente (' + r.deben + ')') + A.kpi(A.euros(r.totalCent), 'Total previsto') + '</div>' +
      '<section class="tarjeta"><h2>Por precio</h2><ul class="lista-avisos">' + Object.keys(r.porPrecio).map(function (k) { return '<li>' + A.esc(k) + ': ' + r.porPrecio[k] + '</li>'; }).join('') + '</ul></section>' +
      '<section class="tarjeta"><h2>Imprimir y exportar</h2><div class="fila-acciones"><button data-l="lista">Lista de inscritos (para pasar lista)</button><button data-l="deben">Pagos pendientes</button><button data-l="csv">Exportar CSV</button></div></section>';
    cont.addEventListener('click', function (e) {
      var b = e.target.closest('[data-l]'); if (!b) return;
      var l = b.getAttribute('data-l'), filas = A.listadoInscripciones(db, a.id, { estado: l === 'deben' ? 'debe' : 'vigentes' });
      var cab = ['Nombre', 'Detalle', 'Teléfono', 'Precio', 'Importe', 'Pagado', l === 'lista' ? 'Asiste' : 'Pendiente'];
      var datos = filas.map(function (y) {
        var tel = y.m ? y.m.telefono : y.x.telefono;
        return [(y.m ? y.m.numero + ' · ' : '') + A.nombreInscrito(db, y.x), y.x.detalle, tel, y.x.precioNombre, A.euros(y.x.importeCent), A.euros(y.x.pagadoCent || 0),
          l === 'lista' ? '☐' : A.euros(y.x.importeCent - (y.x.pagadoCent || 0))];
      });
      if (l === 'csv') return A.descargar(A.nombreFichero(a.nombre) + '.csv', A.aCSV(cab.slice(0, 6).concat(['Estado']), filas.map(function (y) {
        return [A.nombreInscrito(db, y.x), y.x.detalle, y.m ? y.m.telefono : y.x.telefono, y.x.precioNombre, A.decimalPunto(y.x.importeCent).replace('.', ','), A.decimalPunto(y.x.pagadoCent || 0).replace('.', ','), A.ESTADOS_INSCRIPCION[y.x.estado]];
      })), 'text/csv;charset=utf-8');
      A.imprimir((l === 'lista' ? 'Inscritos · ' : 'Pagos pendientes · ') + a.nombre, A.tablaImpresion(cab, datos) + '<p>Total: ' + filas.length + '</p>');
    });
  }

  /* ---------- lotería ---------- */
  function talonarios(cont, db, a, v) {

/* Alcancía · soporte sin ver los datos: errores comprensibles, informe técnico sin datos personales

'use strict';
(function (A) {

  A.limpiaTexto = function (s) {

      .replace(/(\+?\d[\d\s]{7,}\d)/g, '[número]')

/* Alcancía · modo demostración (web pública): entidades de ejemplo con datos inventados.
   Solo actúa si la página define window.ALCANCIA_DEMO (la genera build.py en dist/demo). */
'use strict';
(function (A) {
  if (!window.ALCANCIA_DEMO) return;
  var CLAVE = 'Ejemplo2027';
  var PERFILES = [['hermandad', 'Hermandad o cofradía', 'Hermanos por antigüedad, cuotas, salidas con tarjetas de sitio y censo de votantes del cabildo.'],
    ['ampa', 'AMPA', 'Familias con sus hijos e hijas, cuota familiar por curso y remesa al banco.'],
    ['club', 'Club deportivo', 'Deportistas por categoría, menores con su persona tutora y cuotas mensuales.'],
    ['asociacion', 'Asociación', 'Socios por grupos, cuotas anuales, comunicaciones y protección de datos.']];

  function perfilURL() {

  /* Si el navegador no deja cifrar o guardar (página abierta por http, navegador interno de una app,

      await A.crearEntidad(A.ejemploEntidad(perfil), CLAVE);
      A.rellenarEjemplo(A.S.db);

      await A.guardarAhora();

      A.S.db = A.nuevaBD(A.ejemploEntidad(perfil));
      A.rellenarEjemplo(A.S.db); A.S.db.ajustes.bloqueoMin = 240;

    location.hash = '#/panel'; await A.pintar();
    A.toast(enMemoria ? 'Demostración con datos inventados. Este navegador no deja guardar datos, así que si recargas la página vuelve a empezar.'
                      : 'Demostración con datos inventados. Lo que cambies se guarda solo en este navegador.');

    raiz.innerHTML = '<main class="acceso"><div class="caja"><div class="cabeza"><h1 class="marca-acceso">' + A.MARCA.logo + '</h1>' +
      '<p><strong>Demostración.</strong> Elige un tipo de entidad y prueba ' + A.APP.nombre + ' con datos inventados: da de alta socios, genera cuotas, prepara una remesa o imprime listados.</p>' +

      '<div class="opciones opciones-demo">' + PERFILES.map(function (x) {
